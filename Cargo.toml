[package]
name = "uart-viewer"
version = "0.1.0"
description = "Serial debug viewer for the cell cycler"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serialport = "4"
