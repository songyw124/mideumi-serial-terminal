name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize manual release runs so they cannot upload to the same draft concurrently.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Read and validate version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit(f'Tag must match Cargo.toml version: expected {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')

      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              if (!data.draft) throw new Error(`${tag} is already published; bump the version for a new release.`);
              if (data.target_commitish !== context.sha) throw new Error('The existing draft targets a different commit. Delete that draft and its tag, or bump the version.');
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const filename = (suffix) => "`Mideumi.Serial.Terminal_" + tag.slice(1) + "_" + suffix + "`";
            const body = [
              "Download the package matching your operating system:",
              "",
              "- **Windows — Intel/AMD 64-bit**",
              "  - " + filename("x64-portable.exe") + " — **Recommended download.** Run directly without installing. Requires Microsoft Edge WebView2 Runtime; Windows may still warn about the unsigned executable.",
              "  - " + filename("x64-setup.exe") + " — Standard installer.",
              "  - " + filename("x64_en-US.msi") + " — Alternative Windows Installer package. You only need one installer.",
              "",
              "- **macOS — Apple Silicon (M1 and newer)**",
              "  - " + filename("aarch64.dmg") + " — Recommended download.",
              "  - " + filename("aarch64.app.tar.gz") + " — Compressed application bundle.",
              "",
              "- **macOS — Intel**",
              "  - " + filename("x64.dmg") + " — Recommended download.",
              "  - " + filename("x64.app.tar.gz") + " — Compressed application bundle.",
              "",
              "- **Linux — Intel/AMD 64-bit**",
              "  - " + filename("amd64.deb") + " — Package for Ubuntu/Debian.",
              "  - " + filename("amd64.AppImage") + " — Alternative application package; make executable before launching.",
              "",
              "- **Linux — ARM64 / Raspberry Pi**",
              "  - " + filename("arm64.deb") + " — Package for compatible 64-bit Ubuntu/Debian/Raspberry Pi desktop systems. Not for 32-bit Raspberry Pi OS.",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Mideumi Serial Terminal ${tag}`,
              body,
              draft: true, prerelease: tag.includes('-')
            });
            return data.id;

  build:
    needs: prepare
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Linux ARM64 (Raspberry Pi)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev xdg-utils
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2
      - name: Test Rust code on the runner
        run: cargo test --locked
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: '.'
          tauriScript: tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          # Arguments after -- are forwarded to Cargo.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      # Build separately without bundling so Tauri embeds the correct bundle metadata.
      - name: Build and upload portable Windows executable
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tauriScript: tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadPlainBinary: true
          releaseAssetNamePattern: 'Mideumi.Serial.Terminal_[version]_x64-portable[ext]'
          args: --target ${{ matrix.target }} --no-bundle -- --locked
