<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mideumi Serial Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="windowTitlebar" data-tauri-drag-region>
    <span id="windowTitle" data-tauri-drag-region></span>
  </div>
  <header class="toolbar">
    <div class="group connection-controls">
      <select id="port" title="Serial port"></select>
      <button id="refresh" title="Refresh port list" aria-label="Refresh port list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
      <div class="numbox" title="Baud rate">
        <div class="num-field">
          <input id="baud" class="num" inputmode="numeric" spellcheck="false" autocomplete="off">
          <div class="num-display" aria-hidden="true"></div>
        </div>
        <span class="unit">bps</span>
        <button id="baudPick" class="num-pick menu-toggle" title="Common baud rates" aria-label="Common baud rates" tabindex="-1">
          <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M0 0h10L5 6z"/>
          </svg>
        </button>
        <div id="baudMenu" class="menu" hidden></div>
      </div>
      <button id="connect" class="primary"><span>Connect</span></button>
      <button id="clear" class="danger" title="Clear log">Clear</button>
      <button id="save" title="Save buffer to file">Save&hellip;</button>
    </div>

    <div class="group grow">
      <input id="filter" class="grow" placeholder="Filter (regex, case-insensitive, Esc clears)" spellcheck="false">
    </div>

    <div class="group">
      <label><input type="checkbox" id="timestamps"> Time</label>
      <label><input type="checkbox" id="wrap"> Wrap</label>
      <label><input type="checkbox" id="follow"> Auto-scroll</label>
    </div>

    <div class="group">
      <select id="font" title="Font (available local fonts)">
        <option value="monospace">System monospace</option>
        <option>Menlo</option>
        <option>Monaco</option>
        <option>Cascadia Mono</option>
        <option>Consolas</option>
        <option>Lucida Console</option>
        <option>Courier New</option>
        <option>DejaVu Sans Mono</option>
        <option>Liberation Mono</option>
        <option>Noto Sans Mono</option>
      </select>
      <div class="numbox" title="Font size">
        <input id="fontSize" class="numtext" inputmode="decimal" spellcheck="false" autocomplete="off">
        <span class="unit">pt</span>
      </div>
      <label title="Max lines kept in memory">Buffer
        <div class="numbox">
          <div class="num-field">
            <input id="bufferSize" class="num" inputmode="numeric" spellcheck="false" autocomplete="off">
            <div class="num-display" aria-hidden="true"></div>
          </div>
          <span class="unit">lines</span>
        </div>
      </label>
    </div>
  </header>

  <div id="filterBar" class="filterbar" hidden>
    <span>Filter <code id="filterText"></code> active: showing <span id="filterShown"></span> of <span id="filterTotal"></span> lines</span>
    <button id="filterClear">Clear filter</button>
  </div>

  <main id="view">
    <div id="spacer"></div>
    <div id="rows"></div>
  </main>

  <footer>
    <div class="group grow">
      <input id="sendText" class="grow" placeholder="Send&hellip; (Enter to send, &uarr;/&darr; history)" spellcheck="false">
      <div class="picker">
        <button id="lineEnding" class="menu-toggle" title="Line ending appended when sending">
          <span id="lineEndingLabel">CR+LF</span>
          <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M0 0h10L5 6z"/>
          </svg>
        </button>
        <div id="lineEndingMenu" class="menu up" hidden></div>
      </div>
      <button id="send" class="primary">Send</button>
    </div>
    <div id="status"></div>
  </footer>

  <div id="contextMenu" class="menu context" hidden></div>

  <script src="main.js"></script>
</body>
</html>
